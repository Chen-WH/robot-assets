asset_root: /home/chenwh/ros2_ws/src/robot-assets/dexrobot_021
usd_dir: /home/chenwh/ros2_ws/src/robot-assets/dexrobot_021/usd
source_format: urdf
converter: IsaacLab UrdfConverter
isaaclab_path: /home/chenwh/Git/my_isaaclab
conda_env: my_isaaclab_500

assets:
  - name: dexhand021_left_collision_convex
    source: ../urdf/dexhand021_left_collision_convex.urdf
    usd: dexhand021_left_collision_convex.usd
  - name: dexhand021_left_primitive_collision
    source: ../urdf/dexhand021_left_primitive_collision.urdf
    usd: dexhand021_left_primitive_collision.usd
  - name: dexhand021_left_full_visual
    source: ../urdf/dexhand021_left_full_visual.urdf
    usd: dexhand021_left_full_visual.usd
  - name: dexhand021_right_collision_convex
    source: ../urdf/dexhand021_right_collision_convex.urdf
    usd: dexhand021_right_collision_convex.usd
  - name: dexhand021_right_primitive_collision
    source: ../urdf/dexhand021_right_primitive_collision.urdf
    usd: dexhand021_right_primitive_collision.usd
  - name: dexhand021_right_full_visual
    source: ../urdf/dexhand021_right_full_visual.urdf
    usd: dexhand021_right_full_visual.usd

conversion:
  force_usd_conversion: true
  make_instanceable: true
  fix_base: true
  root_link_name:
    left: left_hand_base
    right: right_hand_base
  link_density: 0.0
  merge_fixed_joints: false
  convert_mimic_joints_to_normal_joints: false
  joint_drive:
    drive_type: force
    target_type: position
    gains:
      stiffness: 100.0
      damping: 1.0
  collider_type: convex_hull
  self_collision: false
  replace_cylinders_with_capsules: false
  collision_from_visuals: false

notes:
  - Fixed joints are intentionally not merged so the five pad links remain separate rigid bodies.
  - The mimic model is kept only for MJCF and is not exported as USD.
